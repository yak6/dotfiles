# ── palette ─────────────────────────────────────
$bg      = 0b0b0b
$surface = 141414
$line    = 2a2a2a
$dim     = 5c5c5c
$fg      = d0d0d0
$accent  = f2f2f2

# ── monitor ─────────────────────────────────────
monitor = , preferred, auto, 1

# ── env ─────────────────────────────────────────
env = XCURSOR_SIZE, 28 
env = XCURSOR_THEME, dmz-white
# ── autostart ───────────────────────────────────
exec-once = awww-daemon
exec-once = waybar
# ── programs ────────────────────────────────────
$mod      = SUPER
$terminal = foot 
$menu     = pkill -x wofi || wofi --show drun --sort=Alphabetical
# ── general ─────────────────────────────────────
general {
    gaps_in     = 20
    gaps_out    = 20
    border_size = 2

    col.active_border   = rgb($accent)
    col.inactive_border = rgb($line)

    layout           = dwindle
    resize_on_border = true
}

# ── decoration ──────────────────────────────────
decoration {
    rounding = 0 

    active_opacity   = 1.0
    inactive_opacity = 1.0
    #dim_inactive     = true
    #dim_strength     = 0.12
  
    shadow {
        enabled      = false
        range        = 1
        render_power = 1
        offset       = 6 6
        color          = rgba(000000ff)
        color_inactive = rgba(00000088)
    }
    blur {
        enabled = false
        size = 6
        passes = 3
        vibrancy = 0.2
    }

}

# ── animations ──────────────────────────────────
animations {
    enabled = true

    bezier = expo,    0.16, 1,    0.3,  1
    bezier = quart,   0.25, 1,    0.5,  1
    bezier = overshot,0.34, 1.4,  0.64, 1
    bezier = linear,  0,    0,    1,    1

    animation = windowsIn,        1, 4, overshot, popin 80%
    animation = windowsOut,       1, 3, quart,    popin 90%
    animation = windowsMove,      1, 4, expo,     slide
    animation = fadeIn,           1, 3, quart
    animation = fadeOut,          1, 3, quart
    animation = fadeDim,          1, 5, quart
    animation = border,           1, 6, quart
    animation = layersIn,         1, 4, expo,     slide
    animation = layersOut,        1, 3, quart,    fade
    animation = fadeLayersIn,     1, 3, quart
    animation = fadeLayersOut,    1, 2, quart
    animation = workspaces,       1, 5, expo,     slidefade 12%
    animation = specialWorkspace, 1, 5, expo,     slidefadevert 20%
}

# ── layouts ─────────────────────────────────────
dwindle {
    preserve_split = true
}

# ── misc ────────────────────────────────────────
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    background_color         = rgb($bg)
    focus_on_activate        = true
}

# ── input ───────────────────────────────────────
input {
    kb_layout    = pl
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# ── keybinds: apps ──────────────────────────────
bind = $mod, T,      exec, $terminal
bind = $mod, RETURN, exec, $terminal
bind = $mod, D,      exec, $menu
bind = $mod, E,      exec, firefox
bind = $mod, Q,      killactive
bind = $mod, M,      exit
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
bind = $mod, P,      pseudo
bind = $mod, J,      layoutmsg, togglesplit

# ── focus: SUPER + arrows ─────────────────────
bind = $mod, LEFT,  movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP,    movefocus, u
bind = $mod, DOWN,  movefocus, d

# ── moving: SUPER + CTRL + arrows ────────
bind = $mod CTRL, LEFT,  movewindow, l
bind = $mod CTRL, RIGHT, movewindow, r
bind = $mod CTRL, UP,    movewindow, u
bind = $mod CTRL, DOWN,  movewindow, d

# ── resize: SUPER + SHIFT + arrows (holding = repeating)
binde = $mod SHIFT, LEFT,  resizeactive, -40 0
binde = $mod SHIFT, RIGHT, resizeactive, 40 0
binde = $mod SHIFT, UP,    resizeactive, 0 -40
binde = $mod SHIFT, DOWN,  resizeactive, 0 40

# ── workspaces: SUPER + 1-0 ─────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# ── window to workspace: SUPER + SHIFT + 1-0 ──────
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ── scratchpad ──────────────────────────────────
bind = $mod, S,       togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# ── mouse ────────────────────────────────────────
bind  = $mod, mouse_down, workspace, e+1
bind  = $mod, mouse_up,   workspace, e-1
bindm = $mod, mouse:272,  movewindow
bindm = $mod, mouse:273,  resizewindow

# ── media ───────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl  = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
